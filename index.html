
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Fantezi Evreni Girişi</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('https://images.unsplash.com/photo-1602205446325-9b938920b3c3?auto=format&fit=crop&w=1470&q=80');
      background-size: cover;
      background-position: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }
    .overlay {
      background-color: rgba(0, 0, 0, 0.65);
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 10px #ff69b4;
    }
    input[type="password"] {
      padding: 0.5rem;
      border-radius: 5px;
      border: none;
      margin-right: 0.5rem;
    }
    button {
      padding: 0.5rem 1rem;
      background-color: #ff69b4;
      border: none;
      border-radius: 5px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="login-box">
      <h1>💋 Fantezi Evrenine Giriş</h1>
      <input type="password" id="password" placeholder="4 Haneli Kod">
      <button onclick="login()">Giriş Yap</button>
    </div>
  </div>

  <script>
    const correctPassword = "1234";
    function login() {
      const pw = document.getElementById("password").value;
      if (pw === correctPassword) {
        window.location.href = "imagegen.html";
      } else {
        alert("Şifre hatalı! Lütfen tekrar deneyin.");
      }
    }
  </script>
</body>
</html>
